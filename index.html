<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mi Página Web</h1>
        <p>Bienvenida Luz ✨</p>
    </header>

    <!-- BOTÓN MODO OSCURO -->
    <div style="text-align:center; margin:20px;">
        <button id="toggleDark">🌙 Modo oscuro</button>
    </div>

    <section>
        <h2>Mensajes</h2>

        <button onclick="mostrarmensaje()">
            Mostrar mensaje 1
        </button>

        <p id="mensaje"></p>

        <button onclick="mostrarmensaje2()">
            Mostrar mensaje 2
        </button>

        <p id="mensaje2"></p>
    </section>

    <!-- ACORDEÓN -->
    <section>

        <div class="acordeon">

            <button class="acordeon-btn">
                ¿Qué es HTML?
            </button>

            <div class="acordeon-contenido">
                <p>
                    HTML es el lenguaje para crear páginas web.
                </p>
            </div>

        </div>

        <div class="acordeon">

            <button class="acordeon-btn">
                ¿Qué es CSS?
            </button>

            <div class="acordeon-contenido">
                <p>
                    CSS sirve para dar estilos y diseño.
                </p>
            </div>

        </div>

    </section>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
